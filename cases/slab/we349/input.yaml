---
# we349: derived from slab72-we1000 by setting the leading-edge velocity scale
# u0 = sqrt(5*We) m/s. We = 349 corresponds to u0 = 41.7732 m/s. Used together with
# we126 and slab72-we1000 (the canonical We=1000 case) to reproduce dissertation
# Fig. 4.11 (receding angle vs leading-edge Weber number).
#
# All numerics, mesh, BC topology, IC topology, sigma, integrator, dt, and
# ts_max_time are identical to slab72-we1000; only the shearRate (and therefore
# tau_adv = L_lobe / u0 = 0.01 / 41.7732 = 2.39e-4 s) differ.
# See ../slab72-we1000/input.yaml for the full setup commentary.
environment:
  title: slab2dcoords
  tagDirectory: false
arguments:
  dm_plex_gmsh_use_regions: true
  dm_plex_check_all: true
  dm_plex_check_geometry: true
  dm_plex_check_skeleton: true
  dm_view: true
  dm_plex_view: true
timestepper:
  name: theMainTimeStepper
  arguments:
    # Stability check: with dt=5e-8 the CFL ~ 0.1 and the surface-tension stability bound
    # dt_st ~ sqrt(rho_paraffin*h^3/sigma) ~ 5e-5 is three orders of magnitude looser, so explicit Euler
    # is safe.  RK2 was attempted as a margin-of-safety measure but doubles the SurfaceForce cost
    # per step; we revert to Euler to keep wall-clock comparable to slab72-asis.
    ts_type: euler
    # 1.4e-3 = 10 * tau_adv (where tau_adv = L_lobe / U_shear = 0.01/70.71 ~ 1.41e-4 s).
    # Hard cap for Part 3 equilibration window; soft termination is performed in postproc
    # via tools/postprocess_slab.py --detect-equilibrium (median-filtered range-of-theta
    # < 0.5 deg over two consecutive 1*tau_adv windows after t >= 3*tau_adv).
    ts_max_time: 1.4e-3
    ts_dt: 5e-8
    ts_adapt_type: none
  io: !<!ablate::io::Hdf5MultiFileSerializer>
    interval: !<!ablate::io::interval::FixedInterval> 200
  domain: !<!ablate::domain::MeshFile> &1
    name: slabMesh
    path: ./slabBurner2DMesh.msh
    modifiers:
      - !<!ablate::domain::modifiers::CollapseLabels>
        regions:
          - name: inlet
          - name: wall
          - name: outlet
          - name: slab
          - name: main
      - !<!ablate::domain::modifiers::ExtrudeLabel>
        regions:
          - name: inlet
          - name: wall
          - name: outlet
          - name: slab
        boundaryRegion:
          name: boundaryFaces
        originalRegion:
          name: flowRegion
        extrudedRegion:
          name: boundaryCells
        thickness: 0.0008
      - !<!ablate::domain::modifiers::CreateLabel>
        region:
          name: inletBoundaryCells
        function: "x < 0 ? 1.0 : 0"
      - !<!ablate::domain::modifiers::CreateLabel>
        region:
          name: outletBoundaryCells
        function: "x > 0.1 ? 1.0 : 0"
      - !<!ablate::domain::modifiers::CreateLabel>
        region:
          name: upperBoundaryCells
        function: "y > 0.025 ? 1.0 : 0"
      - !<!ablate::domain::modifiers::SubtractLabel>
        differenceRegion:
          name: slabBoundaryCells
        minuendRegion:
          name: boundaryCells
        subtrahendRegions:
          - name: outletBoundaryCells
          - name: inletBoundaryCells
          - name: upperBoundaryCells
      - !<!ablate::domain::modifiers::DistributeWithGhostCells>
        ghostCellDepth: 4
    fields:
      - !<!ablate::finiteVolume::CompressibleFlowFields>
        eos: !<!ablate::eos::PerfectGas>
          parameters:
            gamma: 1.4
            Rgas: 287.0
      - name: densityvolumeFraction
        type: FVM
      - name: volumeFraction
        type: FVM
      - name: pressure
        location: AUX
        type: FVM
      - name: gasDensity
        location: AUX
        type: FVM
      - name: liquidDensity
        location: AUX
        type: FVM
      - name: gasEnergy
        location: AUX
        type: FVM
      - name: liquidEnergy
        location: AUX
        type: FVM
      - name: debug
        location: AUX
        type: FVM
      - name: debug2
        location: AUX
        type: FVM
      - name: kappa
        location: AUX
        type: FVM
      - name: rank
        location: AUX
        type: FVM
      - name: sf_magnitude
        location: AUX
        type: FVM
      - name: xpos
        location: AUX
        type: FVM
      - name: ypos
        location: AUX
        type: FVM
      - name: phitilde_surfaceforce
        location: AUX
        type: FVM
      - !<!ablate::domain::FieldDescription>
        name: cellLocations
        prefix: cellLocations
        components: [x2, y2]
        location: AUX
        type: FVM
      - !<!ablate::domain::FieldDescription>
        name: rank
        prefix: rank
        location: AUX
        type: FVM
      - !<!ablate::domain::FieldDescription>
        name: vertexLocations
        prefix: vertexLocations
        components: [x3, y3]
        location: AUX
        type: FE
        options:
          petscspace_degree: 1
    options:
      dm_distribute: false
      dm_refine: 0
  initialization:
    # volumeFraction = alpha_PerfectGas (air fraction); see ../slab72-we1000/input.yaml
    # for the full level-set sign-convention discussion.
    - fieldName: volumeFraction
      field: !<!ablate::mathFunctions::Formula> &2
        formula: f1
        nested:
          f1: !<!ablate::levelSet::VOFMathFunction>
            domain: *1
            levelSet: !<!ablate::mathFunctions::Formula>
              formula: "min(0.01 + h, max(h, (0.01/(0.025 - 0.014))*(x - 0.014) + h)) - y"
              nested:
                h: 0.005
    - fieldName: densityvolumeFraction
      field: !<!ablate::mathFunctions::Formula>
        formula: vof*airDensity
        constants: &3
          waterDensity: 998.23
          waterCp: 8095.08
          waterGamma: 1.932
          airDensity: 1.1614401858304297
          airCp: 717.5
          airGamma: 1.4
          T: 300
          P: 100000
          shearRate: 41.77319714841085
          h_bc: 0.001
        nested:
          vof: *2
          waterMassFraction: !<!ablate::mathFunctions::Formula> &4
            formula: " waterDensity*(1-vof) / (waterDensity*(1-vof) + airDensity*vof) "
            constants: *3
            nested:
              vof: *2
          airMassFraction: !<!ablate::mathFunctions::Formula> &5
            formula: " airDensity*vof / (waterDensity*(1-vof) + airDensity*vof) "
            constants: *3
            nested:
              vof: *2
    - fieldName: euler
      field: !<!ablate::mathFunctions::Formula>
        formula: density, density*(Yw*waterEnergy + Ya*airEnergy), density*0.0, density*0.0
        constants: *3
        nested:
          vof: *2
          Yw: *4
          Ya: *5
          density: !<!ablate::mathFunctions::Formula>
            formula: " waterDensity*airDensity/(waterDensity*Ya + airDensity*Yw) "
            constants: *3
            nested:
              Ya: *5
              Yw: *4
          waterEnergy: !<!ablate::mathFunctions::Formula>
            formula: (waterCp/waterGamma)*T + 0.5*(0*0 + 0*0) + waterP0/waterDensity
            constants: *3
            nested:
              waterP0: !<!ablate::mathFunctions::Formula>
                formula: " ( (waterGamma - 1)*waterDensity*waterCp*T/waterGamma - P)"
                constants: *3
          airEnergy: !<!ablate::mathFunctions::Formula>
            # e = Cv*T = (Cp/gamma)*T for an ideal gas; airCp/airGamma = 512.5 J/kg/K.
            formula: (airCp/airGamma)*T + 0.5*(0*0 + 0*0)
            constants: *3
solver: !<!ablate::finiteVolume::FiniteVolumeSolver>
  id: Multiphase Problem
  region:
    name: flowRegion
  processes:
    - !<!ablate::finiteVolume::processes::NavierStokesTransport>
      eos: !<!ablate::eos::PerfectGas>
        parameters:
          gamma: 0
          Rgas: 0
      transport: !<!ablate::eos::transport::TwoPhaseTransport>
        transport1: !<!ablate::eos::transport::Constant>
          k: 0
          mu: 0
        transport2: !<!ablate::eos::transport::Constant>
          k: 0
          mu: 0
    - !<!ablate::finiteVolume::processes::TwoPhaseEulerAdvection>
      eos: !<!ablate::eos::TwoPhase>
        eos1: !<!ablate::eos::PerfectGas> &6
          parameters:
            gamma: 1.4
            Rgas: 287
        eos2: !<!ablate::eos::StiffenedGas> &7
          parameters:
            gamma: 1.932
            Cp: 8095.08
            p0: 1169350402.52
      fluxCalculatorGasGas: !<!ablate::finiteVolume::fluxCalculator::AusmpUp>
        eosL: *6
        eosR: *6
      fluxCalculatorGasLiquid: !<!ablate::finiteVolume::fluxCalculator::AusmpUp>
        eosL: *6
        eosR: *7
      fluxCalculatorLiquidGas: !<!ablate::finiteVolume::fluxCalculator::AusmpUp>
        eosL: *7
        eosR: *6
      fluxCalculatorLiquidLiquid: !<!ablate::finiteVolume::fluxCalculator::AusmpUp>
        eosL: *7
        eosR: *7
    - !<!ablate::finiteVolume::processes::locations> ""
    - !<!ablate::finiteVolume::processes::SurfaceForce>
      # sigma per dissertation Sec. 4.4.  C/N control the Gaussian smoother:
      # stencil radius = ceil(C*N) cell layers, Gaussian stdev = C*h.
      # Dissertation cited (C=1, N=2.6) -> 3-layer stencil capturing ~99% of the kernel.
      # Empirically the 3-layer stencil over-walks into ghost cells once the lobe migrates
      # past the slab profile (SEGV around t=1.07e-4 in initial trial).  Reducing to N=2
      # gives a 2-layer stencil capturing ~95% of the kernel, which is still within the
      # tolerance Brackbill (1992) cites for CSF (no quantitative effect on the lobe shape
      # at our grid resolution).  Documented in slab72-fixed/README.md.
      sigma: 50
      C: 1
      N: 2.0
      flipPhiTilde: true
      applyToSolution: true
  boundaryConditions:
    # ---- Inlet (x<0, slabTop(x=0)=0.005) ----
    # Below 0.005: paraffin column at rest.  Above 0.005: air in linear shear.
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: euler_inlet
      labelIds: [inletBoundaryCells]
      boundaryValue:
        fieldName: euler
        field: !<!ablate::mathFunctions::Formula>
          formula: " (y < 0.005) ? waterDensity : airDensity ,
                     (y < 0.005) ? (waterDensity*waterEnergy) : (airDensity*airEnergy) ,
                     (y < 0.005) ? 0.0 : (airDensity*u) ,
                     0.0 "
          constants: *3
          nested:
            u: !<!ablate::mathFunctions::Formula> &8
              formula: " shearRate * min(1, max(0, y/(4*h_bc))) "
              constants: *3
            airEnergy: !<!ablate::mathFunctions::Formula>
              formula: (airCp/airGamma)*T + 0.5*u*u
              constants: *3
              nested:
                u: *8
            waterEnergy: !<!ablate::mathFunctions::Formula>
              formula: (waterCp/waterGamma)*T + waterP0/waterDensity
              constants: *3
              nested:
                waterP0: !<!ablate::mathFunctions::Formula>
                  formula: " ( (waterGamma - 1)*waterDensity*waterCp*T/waterGamma - P)"
                  constants: *3
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: vf_inlet
      labelIds: [inletBoundaryCells]
      boundaryValue:
        fieldName: densityvolumeFraction
        field: !<!ablate::mathFunctions::Formula>
          formula: " (y < 0.005) ? 0.0 : airDensity "
          constants: *3
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: alpha_inlet
      labelIds: [inletBoundaryCells]
      boundaryValue:
        fieldName: volumeFraction
        field: !<!ablate::mathFunctions::Formula>
          formula: " (y < 0.005) ? 0.0 : 1.0 "
          constants: *3
    # ---- Outlet (x>0.1, slabTop(x=0.1)=0.015) ----
    # Below 0.015: paraffin at rest.  Above 0.015: air at the free-stream shearRate.
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: euler_outlet
      labelIds: [outletBoundaryCells]
      boundaryValue:
        fieldName: euler
        field: !<!ablate::mathFunctions::Formula>
          formula: " (y < 0.015) ? waterDensity : airDensity ,
                     (y < 0.015) ? (waterDensity*waterEnergy) : (airDensity*airEnergy) ,
                     (y < 0.015) ? 0.0 : (airDensity*shearRate) ,
                     0.0 "
          constants: *3
          nested:
            airEnergy: !<!ablate::mathFunctions::Formula>
              formula: (airCp/airGamma)*T + 0.5*shearRate*shearRate
              constants: *3
            waterEnergy: !<!ablate::mathFunctions::Formula>
              formula: (waterCp/waterGamma)*T + waterP0/waterDensity
              constants: *3
              nested:
                waterP0: !<!ablate::mathFunctions::Formula>
                  formula: " ( (waterGamma - 1)*waterDensity*waterCp*T/waterGamma - P)"
                  constants: *3
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: vf_outlet
      labelIds: [outletBoundaryCells]
      boundaryValue:
        fieldName: densityvolumeFraction
        field: !<!ablate::mathFunctions::Formula>
          formula: " (y < 0.015) ? 0.0 : airDensity "
          constants: *3
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: alpha_outlet
      labelIds: [outletBoundaryCells]
      boundaryValue:
        fieldName: volumeFraction
        field: !<!ablate::mathFunctions::Formula>
          formula: " (y < 0.015) ? 0.0 : 1.0 "
          constants: *3
    # ---- Upper wall (y>0.025): pure air, fully sheared at u=shearRate ----
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: euler_upper
      labelIds: [upperBoundaryCells]
      boundaryValue:
        fieldName: euler
        field: !<!ablate::mathFunctions::Formula>
          formula: airDensity, airDensity*airEnergy, airDensity*shearRate, 0.0
          constants: *3
          nested:
            airEnergy: !<!ablate::mathFunctions::Formula>
              formula: (airCp/airGamma)*T + 0.5*shearRate*shearRate
              constants: *3
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: vf_upper
      labelIds: [upperBoundaryCells]
      boundaryValue:
        fieldName: densityvolumeFraction
        field: !<!ablate::mathFunctions::Formula>
          formula: airDensity
          constants: *3
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: alpha_upper
      labelIds: [upperBoundaryCells]
      boundaryValue:
        fieldName: volumeFraction
        field: 1.0
    # ---- Slab boundary (under and beneath the slab): pure paraffin at rest ----
    # This is the BC that was wrong in slab72-asis (it forced alpha=1 / airDensity here).
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: euler_slab
      labelIds: [slabBoundaryCells]
      boundaryValue:
        fieldName: euler
        field: !<!ablate::mathFunctions::Formula>
          formula: waterDensity, waterDensity*waterEnergy, 0.0, 0.0
          constants: *3
          nested:
            waterEnergy: !<!ablate::mathFunctions::Formula>
              formula: (waterCp/waterGamma)*T + waterP0/waterDensity
              constants: *3
              nested:
                waterP0: !<!ablate::mathFunctions::Formula>
                  formula: " ( (waterGamma - 1)*waterDensity*waterCp*T/waterGamma - P)"
                  constants: *3
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: vf_slab
      labelIds: [slabBoundaryCells]
      boundaryValue:
        fieldName: densityvolumeFraction
        field: !<!ablate::mathFunctions::Formula>
          formula: "0.0"
    - !<!ablate::finiteVolume::boundaryConditions::EssentialBoundary>
      boundaryName: alpha_slab
      labelIds: [slabBoundaryCells]
      boundaryValue:
        fieldName: volumeFraction
        field: 0.0
  monitors:
    - !<!ablate::monitors::TimeStepMonitor>
      interval: 1
